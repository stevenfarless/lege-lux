name: Import flat verse translation

on:
  workflow_dispatch:
    inputs:
      translation_id:
        description: 'Uppercase translation ID, such as NASB'
        required: true
        type: string
      label:
        description: 'Full display label, including the edition when applicable'
        required: true
        type: string
      edition:
        description: 'Exact edition represented by the source data'
        required: true
        type: string
      year:
        description: 'Publication year for this edition'
        required: true
        type: string
      philosophy:
        description: 'Translation philosophy'
        required: true
        default: formal
        type: choice
        options:
          - formal
          - mediating
          - dynamic
      copyright:
        description: 'Copyright and attribution text approved for display'
        required: true
        type: string
      source_repository:
        description: 'Public GitHub repository containing the source JSON'
        required: true
        default: stevenfarless/Holy-Bible-JSON
        type: string
      source_ref:
        description: 'Exact 40-character source commit SHA'
        required: true
        type: string
      source_path:
        description: 'Path to the flat verse JSON file in the source repository'
        required: true
        default: bibles/english_nasb.json
        type: string
      expected_version:
        description: 'Exact version value expected in every source record'
        required: true
        default: NASB
        type: string
      expected_language:
        description: 'Exact language value expected in every source record'
        required: true
        default: English
        type: string
      language_code:
        description: 'BCP 47 language code used by Lege Lux'
        required: true
        default: en
        type: string
      upload_to_firebase:
        description: 'Upload the validated bundle to Firebase'
        required: true
        default: false
        type: boolean
      commit_to_repository:
        description: 'Commit generated files to the standard translations directory'
        required: true
        default: false
        type: boolean
      distribution_rights_confirmed:
        description: 'I have permission to distribute this edition through Lege Lux'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  import:
    name: Validate and convert translation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Lege Lux exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow inputs
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          UPLOAD_TO_FIREBASE: ${{ inputs.upload_to_firebase }}
          COMMIT_TO_REPOSITORY: ${{ inputs.commit_to_repository }}
          RIGHTS_CONFIRMED: ${{ inputs.distribution_rights_confirmed }}
        run: |
          set -euo pipefail
          if [[ ! "$TRANSLATION_ID" =~ ^[A-Z0-9][A-Z0-9_-]*$ ]]; then
            echo "translation_id must contain only uppercase letters, numbers, underscores, or hyphens."
            exit 1
          fi
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be an exact 40-character commit SHA."
            exit 1
          fi
          if [[ ("$UPLOAD_TO_FIREBASE" == "true" || "$COMMIT_TO_REPOSITORY" == "true") && "$RIGHTS_CONFIRMED" != "true" ]]; then
            echo "Distribution requires distribution_rights_confirmed=true."
            exit 1
          fi
          if [[ -e "translations/$TRANSLATION_ID" && "$COMMIT_TO_REPOSITORY" != "true" ]]; then
            echo "translations/$TRANSLATION_ID already exists. Enable commit_to_repository to update it."
            exit 1
          fi

      - name: Checkout pinned source data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: .translation-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve source file
        id: source
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="$(realpath .translation-source)"
          SOURCE_FILE="$(realpath -e ".translation-source/$SOURCE_PATH")"
          case "$SOURCE_FILE" in
            "$SOURCE_ROOT"/*) ;;
            *)
              echo "source_path must resolve inside the checked-out source repository."
              exit 1
              ;;
          esac
          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Source path is not a file: $SOURCE_FILE"
            exit 1
          fi
          echo "file=$SOURCE_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate importer syntax
        run: python -m py_compile scripts/import_flat_verse_json.py scripts/split_translations.py

      - name: Convert source into Lege Lux files
        env:
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          TRANSLATION_ID: ${{ inputs.translation_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_LANGUAGE: ${{ inputs.expected_language }}
        run: |
          python scripts/import_flat_verse_json.py \
            "$SOURCE_FILE" \
            "$TRANSLATION_ID" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-language "$EXPECTED_LANGUAGE"

      - name: Write translation metadata
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          LABEL: ${{ inputs.label }}
          EDITION: ${{ inputs.edition }}
          YEAR: ${{ inputs.year }}
          PHILOSOPHY: ${{ inputs.philosophy }}
          COPYRIGHT_TEXT: ${{ inputs.copyright }}
          LANGUAGE_CODE: ${{ inputs.language_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          translation_id = os.environ["TRANSLATION_ID"]
          try:
              year = int(os.environ["YEAR"])
          except ValueError as exc:
              raise SystemExit("year must be an integer") from exc

          info = {
              "id": translation_id,
              "label": os.environ["LABEL"],
              "abbreviation": translation_id,
              "language": os.environ["LANGUAGE_CODE"],
              "textDirection": "ltr",
              "year": year,
              "canon": "protestant",
              "philosophy": os.environ["PHILOSOPHY"],
              "edition": os.environ["EDITION"],
              "copyright": os.environ["COPYRIGHT_TEXT"],
          }

          path = Path("translations") / translation_id / "info.json"
          path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Generate canon metadata
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: node scripts/generate-meta.js "$TRANSLATION_ID"

      - name: Audit converted translation
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: node --experimental-vm-modules scripts/audit-translations.js "$TRANSLATION_ID"

      - name: Build downloadable bundle
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: python dev-scripts/.github/scripts/bundle_translations.py "$TRANSLATION_ID"

      - name: Remove NASB95 Firebase-only routing
        if: ${{ inputs.commit_to_repository && inputs.translation_id == 'NASB95' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          api_path = Path('bible-api.js')
          source = api_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label} marker, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '''const BUNDLE_TRANSLATIONS = new Set([\n    "NASB95",\n]);\n\n''',
              '',
              'BUNDLE_TRANSLATIONS',
          )
          replace_once(
              '        const generatedSearchIndex = BUNDLE_TRANSLATIONS.has(translation) ? {} : null;\n',
              '',
              'generated search index declaration',
          )
          replace_once(
              '''                    const url = BUNDLE_TRANSLATIONS.has(translation)\n                        ? `${FIREBASE_DB_URL}/bundles/${encodeURIComponent(translation)}/books/${encodeURIComponent(filename)}.json`\n                        : `./translations/${encodeURIComponent(translation)}/` +\n                            `${encodeURIComponent(filename)}.json`;\n''',
              '''                    const url =\n                        `./translations/${encodeURIComponent(translation)}/` +\n                        `${encodeURIComponent(filename)}.json`;\n''',
              'bundle URL branch',
          )
          replace_once(
              '''                if (generatedSearchIndex !== null) {\n                    for (const [chapter, verses] of Object.entries(data)) {\n                        if (!verses || typeof verses !== 'object') continue;\n                        for (const [verse, text] of Object.entries(verses)) {\n                            if (Number(verse) <= 0) continue;\n                            generatedSearchIndex[`${book} ${chapter}:${verse}`] =\n                                String(text).toLowerCase();\n                        }\n                    }\n                }\n\n''',
              '',
              'generated search index population',
          )
          replace_once(
              '''        if (generatedSearchIndex !== null) {\n            const stored = await idbPutSearchIndex(translation, generatedSearchIndex);\n            if (!stored) {\n                await idbDeleteTranslation(translation);\n                this.evictTranslation(translation);\n                throw new Error(`Could not store ${translation} search index`);\n            }\n            this._searchIndexCache.set(translation, generatedSearchIndex);\n        } else {\n            try {\n                const url =\n                    `./translations/${encodeURIComponent(translation)}/` +\n                    `${encodeURIComponent(translation)}_search_index.json`;\n                const response = await fetch(url);\n\n                if (response.ok) {\n                    const index = await response.json();\n                    await idbPutSearchIndex(translation, index);\n                    this._searchIndexCache.set(translation, index);\n                }\n            } catch (error) {\n                console.warn(`Search index unavailable for ${translation}`, error);\n            }\n        }\n''',
              '''        try {\n            const url =\n                `./translations/${encodeURIComponent(translation)}/` +\n                `${encodeURIComponent(translation)}_search_index.json`;\n            const response = await fetch(url);\n\n            if (response.ok) {\n                const index = await response.json();\n                await idbPutSearchIndex(translation, index);\n                this._searchIndexCache.set(translation, index);\n            }\n        } catch (error) {\n            console.warn(`Search index unavailable for ${translation}`, error);\n        }\n''',
              'generated search index finalization',
          )
          api_path.write_text(source, encoding='utf-8')

          index_path = Path('translations/index.json')
          catalog = json.loads(index_path.read_text(encoding='utf-8'))
          entries = [item for item in catalog['translations'] if item.get('id') == 'NASB95']
          if len(entries) != 1:
              raise SystemExit(f'Expected one NASB95 catalog entry, found {len(entries)}')
          entries[0].pop('access', None)
          entries[0].pop('source', None)
          index_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate standard repository layout
        if: ${{ inputs.commit_to_repository }}
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: |
          node --check bible-api.js
          node --check firebase-config.js
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          translation_id = os.environ['TRANSLATION_ID']
          translation_dir = Path('translations') / translation_id
          meta = json.loads((translation_dir / 'meta.json').read_text(encoding='utf-8'))
          search_index = json.loads(
              (translation_dir / f'{translation_id}_search_index.json').read_text(encoding='utf-8')
          )
          book_files = [
              path for path in translation_dir.glob('*.json')
              if path.name not in {
                  'info.json',
                  'meta.json',
                  f'{translation_id}_search_index.json',
              }
          ]
          assert len(book_files) == 66, len(book_files)
          assert len(meta['books']) == 66
          assert len(search_index) > 0
          if translation_id == 'NASB95':
              assert len(search_index) == 31102
              api = Path('bible-api.js').read_text(encoding='utf-8')
              assert 'BUNDLE_TRANSLATIONS' not in api
              assert 'FIREBASE_DB_URL}/bundles/' not in api
          PY
          git diff --check

      - name: Commit generated translation to exp
        if: ${{ inputs.commit_to_repository }}
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: |
          git add bible-api.js firebase-config.js translations/index.json "translations/$TRANSLATION_ID"
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git commit -m "feat(translations): add $TRANSLATION_ID to standard downloads" \
            -m "Store the generated books, metadata, and search index under translations/$TRANSLATION_ID so the existing repository-backed download and IndexedDB installation path is reused."
          git push origin exp

      - name: Install Firebase uploader
        if: ${{ inputs.upload_to_firebase }}
        run: pip install firebase-admin

      - name: Write Firebase service account
        if: ${{ inputs.upload_to_firebase }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Upload bundle to Firebase
        if: ${{ inputs.upload_to_firebase }}
        env:
          TARGET_TRANSLATION: ${{ inputs.translation_id }}
        run: python .github/scripts/upload_bundles.py

      - name: Write run summary
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_PATH: ${{ inputs.source_path }}
          UPLOAD_TO_FIREBASE: ${{ inputs.upload_to_firebase }}
          COMMIT_TO_REPOSITORY: ${{ inputs.commit_to_repository }}
        run: |
          {
            echo "## Translation import"
            echo
            echo "- Translation: \`$TRANSLATION_ID\`"
            echo "- Source: \`$SOURCE_REPOSITORY@$SOURCE_REF:$SOURCE_PATH\`"
            echo "- Canon audit: passed"
            echo "- Bundle build: passed"
            echo "- Firebase upload: \`$UPLOAD_TO_FIREBASE\`"
            echo "- Standard repository download: \`$COMMIT_TO_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated text when not committed
        if: ${{ always() && !inputs.commit_to_repository }}
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: rm -rf "translations/$TRANSLATION_ID"

      - name: Remove temporary source, bundle, and credentials
        if: always()
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: |
          rm -rf .translation-source
          rm -f "bundles/${TRANSLATION_ID}_bundle.json" /tmp/service_account.json
