name: Bookshift Search Scope Fix

on:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/bookshift-search-scope-fix.yml
  workflow_dispatch:

jobs:
  patch:
    name: Patch Bookshift search scope
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout bookshift
        uses: actions/checkout@v7
        with:
          ref: bookshift
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch search and prefetch scope
        run: |
          python - <<'PY'
          from pathlib import Path

          licensed = '"CSB", "ESV", "ISV", "LEB", "MEV", "NET", "NIV", "NKJV", "NLT", "NRSVUE"'

          bible_path = Path('bible-api.js')
          text = bible_path.read_text(encoding='utf-8')

          if 'const LICENSED_TRANSLATIONS = new Set([' not in text:
              text = text.replace(
                  'const REPO_TRANSLATIONS = new Set([\n    "ASV", "BLB", "BSB", "KJV", "MSB", "WEB",\n]);',
                  'const REPO_TRANSLATIONS = new Set([\n    "ASV", "BLB", "BSB", "KJV", "MSB", "WEB",\n]);\n\nconst LICENSED_TRANSLATIONS = new Set([\n    ' + licensed + ',\n]);'
              )

          if 'isLicensedTranslation(translation)' not in text:
              text = text.replace(
                  '    setBookList(translation, bookNames) {\n        if (!translation || !Array.isArray(bookNames) || bookNames.length === 0) return;\n        this._translationBookLists.set(translation, bookNames);\n    }',
                  '    setBookList(translation, bookNames) {\n        if (!translation || !Array.isArray(bookNames) || bookNames.length === 0) return;\n        this._translationBookLists.set(translation, bookNames);\n    }\n\n    isLicensedTranslation(translation) {\n        return LICENSED_TRANSLATIONS.has(translation);\n    }'
              )

          if 'is licensed and is not available by default' not in text:
              text = text.replace(
                  '        if (!FIREBASE_TRANSLATIONS_ENABLED) {\n            console.warn(`BibleApi: Firebase translations disabled — cannot load ${translation}/${this._sanitizeForLog(book)}`);\n            return null;\n        }',
                  '        if (LICENSED_TRANSLATIONS.has(translation)) {\n            console.warn(`BibleApi: ${translation} is licensed and is not available by default`);\n            this._bookCache.set(cacheKey, null);\n            return null;\n        }\n\n        if (!FIREBASE_TRANSLATIONS_ENABLED) {\n            console.warn(`BibleApi: Firebase translations disabled — cannot load ${translation}/${this._sanitizeForLog(book)}`);\n            return null;\n        }'
              )
              text = text.replace(
                  '                if (isRepo && !PRECACHED_TRANSLATIONS.has(translation)) {',
                  '                if (LICENSED_TRANSLATIONS.has(translation)) {\n                    this._searchIndexCache.set(translation, null);\n                    return null;\n                }\n\n                if (isRepo && !PRECACHED_TRANSLATIONS.has(translation)) {'
              )
              text = text.replace(
                  '    async downloadTranslation(translation, bookList, onProgress) {\n        const books = bookList?.length ? bookList : BOOK_LOAD_ORDER;',
                  '    async downloadTranslation(translation, bookList, onProgress) {\n        if (LICENSED_TRANSLATIONS.has(translation)) {\n            throw new Error(`${translation} is licensed and is not available for download by default`);\n        }\n\n        const books = bookList?.length ? bookList : BOOK_LOAD_ORDER;'
              )
              text = text.replace(
                  '        const candidates = [...LOCAL_TRANSLATIONS].filter((t) => t !== activeTranslation);',
                  '        const candidates = [...LOCAL_TRANSLATIONS].filter((t) => (\n            t !== activeTranslation && !LICENSED_TRANSLATIONS.has(t)\n        ));'
              )

          bible_path.write_text(text, encoding='utf-8')

          app_path = Path('app.js')
          app_text = app_path.read_text(encoding='utf-8')
          app_text = app_text.replace(
              '        const active = this.state.translation;\n        const others = [...LOCAL_TRANSLATIONS].filter(t => t !== active);',
              '        const active = this.state.translation;\n        const others = [...LOCAL_TRANSLATIONS].filter((t) => (\n            t !== active && !this.bibleApi?.isLicensedTranslation?.(t)\n        ));'
          )
          app_path.write_text(app_text, encoding='utf-8')

          workflow_path = Path('.github/workflows/bookshift-search-scope-fix.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Validate patched JavaScript
        run: |
          node --check bible-api.js
          node --check app.js

      - name: Commit fix
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bible-api.js app.js .github/workflows/bookshift-search-scope-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(bookshift): limit search to available translations" \
            -m "Prevent Bookshift prefetch and megasearch paths from fetching hidden licensed translations by default. Block default licensed downloads until entitlement gating is implemented."
          git push origin HEAD:bookshift
