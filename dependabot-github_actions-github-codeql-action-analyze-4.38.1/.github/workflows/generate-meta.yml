name: Generate Translation Metadata

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate meta.json for all translations
        run: node scripts/generate-meta.js

      - name: Generate translations/index.json
        run: node scripts/generate-index.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/**/meta.json translations/index.json
          git diff --cached --quiet || git commit -m "chore(meta): regenerate translation metadata [skip ci]"
          git push
