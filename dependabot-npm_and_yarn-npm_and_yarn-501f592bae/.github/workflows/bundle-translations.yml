name: Bundle Translations

on:
  workflow_dispatch:
    inputs:
      translation:
        description: 'Translation abbreviation to bundle (blank = all)'
        required: false
        default: ''

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run bundler
        run: |
          python dev-scripts/.github/scripts/bundle_translations.py "${{ github.event.inputs.translation }}"

      - name: Commit bundles
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bundles/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update translation bundles"
          git push
