name: Upload All to Firebase

on:
  workflow_dispatch:
    inputs:
      translation:
        description: 'Translation to upload (e.g. ESV, KJV) — leave blank to upload all'
        required: false
        default: ''

jobs:
  upload-translations:
    name: Upload Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Upload translations
        env:
          TARGET_TRANSLATION: ${{ github.event.inputs.translation }}
        run: python .github/scripts/upload_translations.py

      - name: Clean up key
        if: always()
        run: rm -f /tmp/service_account.json

  upload-index:
    name: Upload Translation Index
    runs-on: ubuntu-latest
    needs: upload-translations

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Build and upload translation index
        run: |
          python - <<'EOF'
          import firebase_admin
          from firebase_admin import credentials, db

          cred = credentials.Certificate("/tmp/service_account.json")
          firebase_admin.initialize_app(cred, {
              "databaseURL": "https://esv-bible-6dffb-default-rtdb.firebaseio.com"
          })

          LABELS = {
              "ASV":     "American Standard Version",
              "BLB":     "Berean Literal Bible",
              "BSB":     "Berean Standard Bible",
              "CSB":     "Christian Standard Bible",
              "ESV":     "English Standard Version",
              "ISV":     "International Standard Version",
              "KJV":     "King James Version",
              "LEB":     "Lexham English Bible",
              "MEV":     "Modern English Version",
              "MSB":     "Majority Standard Bible",
              "NET":     "New English Translation",
              "NIV":     "New International Version",
              "NKJV":    "New King James Version",
              "NLT":     "New Living Translation",
              "NRSVUE":  "New Revised Standard Version Updated Edition",
              "WEB":     "World English Bible",
          }

          translations_ref = db.reference("translations")
          rtdb_keys = translations_ref.get(shallow=True) or {}
          translation_ids = sorted(rtdb_keys.keys())

          if not translation_ids:
              print("No translations found in RTDB at /translations.")
              exit(1)

          index = []
          for abbr in translation_ids:
              entry = {
                  "id":    abbr,
                  "label": LABELS.get(abbr, abbr),
              }
              index.append(entry)
              print(f"  {abbr}: {entry['label']}")

          ref = db.reference("translationIndex")
          ref.set(index)
          print(f"Uploaded translationIndex with {len(index)} entries.")
          EOF

      - name: Clean up key
        if: always()
        run: rm -f /tmp/service_account.json
