name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Cross References JSON
      - Build Firebase Bundle
      - Build Search Index
      - Build search indexes
      - Bundle Translations
      - Create Theme
      - Generate Translation Metadata
      - Split translations into per-book files
      - Add Android Haptics
      - "! Expand Android Haptics"
      - "! Implement Sync Sign-In Prompt"
      - "! Implement Settings Sync Prompt"
      - "! Sync Translation Library"
      - "! Lock UI"
      - "! instant upgrade"
    types:
      - completed
    branches:
      - exp

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_run' && 'exp' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0

      - name: Derive destination directory
        id: dest
        run: |
          if [ "${DEPLOY_BRANCH}" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            DEST="${DEPLOY_BRANCH//\//-}"
            echo "dir=$DEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject build info
        run: |
          BRANCH="${DEPLOY_BRANCH}"
          FULL_SHA="$(git rev-parse HEAD)"
          SHA7="${FULL_SHA::7}"
          if [ "${BRANCH}" = "main" ]; then
            sed -i "s|__BUILD_INFO__||g" index.html
            sed -i "s|__BUILD_COLOR__|#444444|g" css/pericope.css
          else
            case "${BRANCH}" in
              dev)  BUILD_COLOR="#09752b" ;;
              exp)  BUILD_COLOR="#790606" ;;
              *)    BUILD_COLOR="#444444" ;;
            esac
            echo "Injecting: $SHA7"
            sed -i "s|__BUILD_INFO__|${SHA7}|g" index.html
            sed -i "s|__BUILD_COLOR__|${BUILD_COLOR}|g" css/pericope.css
          fi
          sed -i "s/__BUILD_ID__/${SHA7}/g" sw.js index.html
          sed -E -i "s|(<script[^>]*[[:space:]]src=\")([^\"]+\.js)(\")|\1\2?v=${SHA7}\3|g" index.html
          sed -E -i "s|(<link[^>]*rel=\"modulepreload\"[^>]*href=\")app\.js(\")|\1app.js?v=${SHA7}\2|g" index.html
          sed -E -i "s|(<link[^>]*[[:space:]]href=\"css/[^\"]+\.css)(\")|\1?v=${SHA7}\2|g" index.html
          echo "${SHA7}" > version.txt

      - name: Inject Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for f in config/firebase-config.js config/firebase-config.bundle.js; do
            sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" "$f"
            sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" "$f"
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" "$f"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false
          exclude_assets: 'tests/**,package.json,package-lock.json,vitest.config.*,playwright.config.*'
