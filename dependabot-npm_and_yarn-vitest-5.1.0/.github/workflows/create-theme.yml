name: Create Theme

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: Theme name
        required: true
        type: string
      existing_theme_action:
        description: Existing theme
        required: true
        default: stop
        type: choice
        options:
          - stop
          - overwrite
          - rename
      rename_theme_id:
        description: Rename ID
        required: false
        type: string
      mode:
        description: Mode
        required: true
        default: dark
        type: choice
        options:
          - dark
          - light
          - both
      dark_palette:
        description: Dark palette, 8 hex values
        required: true
        type: string
      light_palette:
        description: Light palette, 8 hex values
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-theme:
    name: Create theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Generate theme
        env:
          THEME_NAME: ${{ inputs.theme_name }}
          EXISTING_THEME_ACTION: ${{ inputs.existing_theme_action }}
          RENAME_THEME_ID: ${{ inputs.rename_theme_id }}
          THEME_MODE: ${{ inputs.mode }}
          DARK_PALETTE: ${{ inputs.dark_palette }}
          LIGHT_PALETTE: ${{ inputs.light_palette }}
        run: python3 .github/scripts/create_theme.py

      - name: Verify generated theme
        run: |
          node --check ui.js
          git diff --check
          git diff -- css/themes.css index.html ui.js

      - name: Commit theme
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/themes.css index.html ui.js
          git commit -m "feat: add generated theme"
          git push origin exp
