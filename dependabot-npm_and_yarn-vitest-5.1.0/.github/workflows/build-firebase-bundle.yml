name: Build Firebase Bundle

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install --global esbuild

      - name: Bundle Firebase
        run: |
          esbuild config/firebase-config.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=config/firebase-config.bundle.js
          echo "Bundle size: $(wc -c < config/firebase-config.bundle.js) bytes"

      - name: Patch app.js to import bundle
        run: |
          if grep -q "firebase-config.js'" app.js; then
            sed -i "s|firebase-config.js'|firebase-config.bundle.js'|g" app.js
            echo "Patched app.js to use bundle"
          else
            echo "app.js already points at bundle, no patch needed"
          fi

      - name: Commit changes
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add config/firebase-config.bundle.js app.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "build: regenerate firebase bundle and patch app.js"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
