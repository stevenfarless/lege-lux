name: Cleanup gh-pages on branch delete

on:
  delete:
    branches:
      - '**'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove deleted branch folder
        run: |
          DEST="${{ github.event.ref }}"
          DEST="${DEST//\//-}"
          if [ ! -d "$DEST" ]; then
            echo "No preview folder found for $DEST, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf "$DEST"
          git commit -m "chore(gh-pages): remove preview for deleted branch $DEST"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase
          done
