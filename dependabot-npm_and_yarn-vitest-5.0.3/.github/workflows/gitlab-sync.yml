name: Sync curated branches to GitLab

on:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch curated branches and tags
        run: |
          git fetch origin \
            '+refs/heads/dev:refs/remotes/origin/dev' \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*' \
            --prune

      - name: Push curated branches and tags to GitLab
        env:
          GITLAB_PAT: ${{ secrets.gitlab_pat }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_PAT}@gitlab.com/stevenfarless/lege-lux.git"
          git push gitlab \
            refs/remotes/origin/dev:refs/heads/dev \
            refs/remotes/origin/main:refs/heads/main \
            --tags
