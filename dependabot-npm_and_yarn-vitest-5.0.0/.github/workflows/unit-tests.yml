name: Unit Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  unit-tests:
    name: Run Vitest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
