<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lege Lux Lite</title>
  <style>
    /* Kindle Paperwhite 7th gen: 1072x1448 @ 300ppi, ~90 logical px/inch after scaling.
   Silk browser behaves like a ~768px viewport at default zoom. Target minimum
   tap target: 44px logical. Body text: 22px for comfortable e-ink reading. */

    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      line-height: 1.75;
      color: #000;
      background: #fff;
    }

    a {
      color: #000;
    }

    a:visited {
      color: #000;
    }

    /* ── Toolbar ── */
    #toolbar {
      background: #000;
      color: #fff;
      padding: 10px 12px;
      font-family: Arial, sans-serif;
    }

    #toolbar form {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -ms-flex-wrap: wrap;
      flex-wrap: wrap;
      gap: 8px;
    }

    #trans-select {
      font-size: 18px;
      height: 44px;
      padding: 0 6px;
      border: none;
      background: #333;
      color: #fff;
      -webkit-appearance: none;
      border-radius: 4px;
      min-width: 70px;
    }

    #ref-input {
      font-size: 18px;
      height: 44px;
      padding: 0 8px;
      border: none;
      border-radius: 4px;
      -webkit-flex: 1;
      flex: 1;
      min-width: 100px;
      color: #000;
    }

    #toolbar input[type=submit] {
      font-size: 18px;
      height: 44px;
      padding: 0 14px;
      border: none;
      border-radius: 4px;
      background: #555;
      color: #fff;
      cursor: pointer;
    }

    #toolbar-links {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      border-top: 1px solid #444;
      margin-top: 8px;
    }

    #toolbar-links a {
      display: block;
      -webkit-flex: 1;
      flex: 1;
      text-align: center;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 0;
    }

    #toolbar-links a:first-child {
      border-right: 1px solid #444;
    }

    /* ── Chapter nav bar ── */
    #nav {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: stretch;
      -ms-flex-align: stretch;
      align-items: stretch;
      font-family: Arial, sans-serif;
      border-bottom: 2px solid #000;
      background: #eee;
    }

    #nav-prev-wrap,
    #nav-next-wrap {
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
    }

    #nav-prev-wrap a,
    #nav-next-wrap a {
      display: block;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 18px;
      text-decoration: none;
      color: #000;
      white-space: nowrap;
      background: #ddd;
      border: none;
      line-height: 1;
    }

    #nav-prev-wrap a:active,
    #nav-next-wrap a:active {
      background: #bbb;
    }

    #nav-loc-wrap {
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      justify-content: center;
      padding: 0 8px;
    }

    #nav-loc {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    /* ── Reading content ── */
    #content {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 18px 60px;
    }

    h2.chapter-title {
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #000;
    }

    h2.chapter-title span {
      font-weight: normal;
      font-size: 17px;
    }

    .passage-para {
      margin: 0 0 16px;
      padding: 0;
      text-indent: 1.5em;
    }

    .passage-prologue {
      font-style: italic;
      margin-bottom: 14px;
      text-indent: 0;
    }

    .verse-num {
      font-size: 13px;
      vertical-align: super;
      font-family: Arial, sans-serif;
      color: #444;
      margin-right: 1px;
      font-style: normal;
      line-height: 0;
    }

    /* ── Loading ── */
    #loading {
      padding: 30px 18px;
      font-family: Arial, sans-serif;
      font-size: 20px;
    }

    /* ── Picker ── */
    #picker-screen {
      padding: 14px 16px;
      font-family: Arial, sans-serif;
    }

    #picker-screen h3 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
    }

    #book-list {
      list-style: none;
      margin: 0;
      padding: 0;
      -webkit-columns: 2;
      columns: 2;
      column-gap: 0;
    }

    #book-list li {
      margin: 0;
    }

    #book-list a {
      display: block;
      padding: 12px 10px;
      font-size: 18px;
      border-bottom: 1px solid #ccc;
      text-decoration: none;
      color: #000;
    }

    #book-list a:active {
      background: #eee;
    }

    #chap-list {
      margin: 12px 0 0;
      padding: 0;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-wrap: wrap;
      flex-wrap: wrap;
      gap: 8px;
    }

    #chap-list a {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border: 2px solid #999;
      border-radius: 4px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      text-decoration: none;
      color: #000;
    }

    #chap-list a:active {
      background: #eee;
    }

    .picker-back {
      display: inline-block;
      font-size: 18px;
      padding: 10px 0 14px;
      text-decoration: none;
      color: #000;
    }

    /* ── Search ── */
    #search-screen {
      padding: 14px 16px;
      font-family: Arial, sans-serif;
    }

    #search-screen form {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    #search-input {
      font-size: 18px;
      height: 44px;
      padding: 0 8px;
      border: 2px solid #999;
      border-radius: 4px;
      -webkit-flex: 1;
      flex: 1;
    }

    #search-screen input[type=submit] {
      font-size: 18px;
      height: 44px;
      padding: 0 16px;
      border: 2px solid #999;
      border-radius: 4px;
      background: #eee;
      cursor: pointer;
    }

    #search-results {
      margin-top: 4px;
    }

    .result-item {
      border-bottom: 1px solid #ccc;
      padding: 12px 0;
    }

    .result-ref {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .result-ref a {
      text-decoration: none;
      color: #000;
    }

    .result-text {
      font-size: 18px;
      line-height: 1.6;
    }

    /* ── Error ── */
    .err {
      color: #900;
      font-family: Arial, sans-serif;
      font-size: 18px;
      padding: 16px 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="toolbar">
    <form id="jump-form" action="" method="get">
      <select id="trans-select" name="t">
        <option value="KJV">KJV</option>
        <option value="BSB">BSB</option>
        <option value="ASV">ASV</option>
        <option value="ESV">ESV</option>
        <option value="NIV">NIV</option>
        <option value="NKJV">NKJV</option>
        <option value="NLT">NLT</option>
        <option value="NET">NET</option>
        <option value="WEB">WEB</option>
        <option value="CSB">CSB</option>
        <option value="ISV">ISV</option>
        <option value="LEB">LEB</option>
        <option value="MEV">MEV</option>
        <option value="MSB">MSB</option>
        <option value="NRSVUE">NRSVUE</option>
        <option value="BLB">BLB</option>
      </select>
      <input type="text" id="ref-input" name="ref" placeholder="e.g. John 3" value="">
      <input type="submit" value="Go">
    </form>
    <div id="toolbar-links">
      <a href="#" id="picker-link">Browse</a>
      <a href="#" id="search-link">Search</a>
    </div>
  </div>

  <div id="nav">
    <div id="nav-prev-wrap"></div>
    <div id="nav-loc-wrap"><span id="nav-loc"></span></div>
    <div id="nav-next-wrap"></div>
  </div>

  <div id="loading">Loading&hellip;</div>
  <div id="content" style="display:none;"></div>
  <div id="picker-screen" style="display:none;"></div>
  <div id="search-screen" style="display:none;">
    <form id="search-form" action="" method="get">
      <input type="text" id="search-input" name="q" placeholder="Search word or phrase">
      <input type="submit" value="Search">
    </form>
    <div id="search-results"></div>
  </div>

  <script>
    // Kindle-safe: ES5 only. No let/const, no arrow functions, no template literals,
    // no destructuring, no fetch, no Promise, no Map/Set, no Symbol.

    var BOOKS = [
      'Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy',
      'Joshua', 'Judges', 'Ruth', '1 Samuel', '2 Samuel',
      '1 Kings', '2 Kings', '1 Chronicles', '2 Chronicles',
      'Ezra', 'Nehemiah', 'Esther', 'Job', 'Psalm', 'Proverbs',
      'Ecclesiastes', 'Song of Solomon', 'Isaiah', 'Jeremiah',
      'Lamentations', 'Ezekiel', 'Daniel', 'Hosea', 'Joel', 'Amos',
      'Obadiah', 'Jonah', 'Micah', 'Nahum', 'Habakkuk', 'Zephaniah',
      'Haggai', 'Zechariah', 'Malachi', 'Matthew', 'Mark', 'Luke',
      'John', 'Acts', 'Romans', '1 Corinthians', '2 Corinthians',
      'Galatians', 'Ephesians', 'Philippians', 'Colossians',
      '1 Thessalonians', '2 Thessalonians', '1 Timothy', '2 Timothy',
      'Titus', 'Philemon', 'Hebrews', 'James', '1 Peter', '2 Peter',
      '1 John', '2 John', '3 John', 'Jude', 'Revelation'
    ];

    var CHAPTER_COUNTS = {
      'Genesis': 50, 'Exodus': 40, 'Leviticus': 27, 'Numbers': 36, 'Deuteronomy': 34,
      'Joshua': 24, 'Judges': 21, 'Ruth': 4, '1 Samuel': 31, '2 Samuel': 24,
      '1 Kings': 22, '2 Kings': 25, '1 Chronicles': 29, '2 Chronicles': 36,
      'Ezra': 10, 'Nehemiah': 13, 'Esther': 10, 'Job': 42, 'Psalm': 150, 'Proverbs': 31,
      'Ecclesiastes': 12, 'Song of Solomon': 8, 'Isaiah': 66, 'Jeremiah': 52,
      'Lamentations': 5, 'Ezekiel': 48, 'Daniel': 12, 'Hosea': 14, 'Joel': 3, 'Amos': 9,
      'Obadiah': 1, 'Jonah': 4, 'Micah': 7, 'Nahum': 3, 'Habakkuk': 3, 'Zephaniah': 3,
      'Haggai': 2, 'Zechariah': 14, 'Malachi': 4, 'Matthew': 28, 'Mark': 16, 'Luke': 24,
      'John': 21, 'Acts': 28, 'Romans': 16, '1 Corinthians': 16, '2 Corinthians': 13,
      'Galatians': 6, 'Ephesians': 6, 'Philippians': 4, 'Colossians': 4,
      '1 Thessalonians': 5, '2 Thessalonians': 3, '1 Timothy': 6, '2 Timothy': 4,
      'Titus': 3, 'Philemon': 1, 'Hebrews': 13, 'James': 5, '1 Peter': 5, '2 Peter': 3,
      '1 John': 5, '2 John': 1, '3 John': 1, 'Jude': 1, 'Revelation': 22
    };

    var BOOK_ALIASES = {
      'gen': 'Genesis', 'ex': 'Exodus', 'exo': 'Exodus', 'lev': 'Leviticus', 'num': 'Numbers',
      'deu': 'Deuteronomy', 'deut': 'Deuteronomy', 'josh': 'Joshua', 'jdg': 'Judges', 'judg': 'Judges',
      'rut': 'Ruth', '1sam': '1 Samuel', '2sam': '2 Samuel', '1ki': '1 Kings', '2ki': '2 Kings',
      '1chr': '1 Chronicles', '2chr': '2 Chronicles', 'ezr': 'Ezra', 'neh': 'Nehemiah', 'est': 'Esther',
      'job': 'Job', 'psa': 'Psalm', 'ps': 'Psalm', 'prov': 'Proverbs', 'pro': 'Proverbs',
      'ecc': 'Ecclesiastes', 'eccl': 'Ecclesiastes', 'song': 'Song of Solomon', 'sos': 'Song of Solomon',
      'isa': 'Isaiah', 'jer': 'Jeremiah', 'lam': 'Lamentations', 'eze': 'Ezekiel', 'ezek': 'Ezekiel',
      'dan': 'Daniel', 'hos': 'Hosea', 'joe': 'Joel', 'amo': 'Amos', 'oba': 'Obadiah', 'jon': 'Jonah',
      'mic': 'Micah', 'nah': 'Nahum', 'hab': 'Habakkuk', 'zep': 'Zephaniah', 'hag': 'Haggai',
      'zec': 'Zechariah', 'zech': 'Zechariah', 'mal': 'Malachi', 'mat': 'Matthew', 'matt': 'Matthew',
      'mrk': 'Mark', 'luk': 'Luke', 'joh': 'John', 'jn': 'John', 'act': 'Acts', 'rom': 'Romans',
      '1cor': '1 Corinthians', '2cor': '2 Corinthians', 'gal': 'Galatians', 'eph': 'Ephesians',
      'phi': 'Philippians', 'php': 'Philippians', 'col': 'Colossians', '1th': '1 Thessalonians',
      '2th': '2 Thessalonians', '1ti': '1 Timothy', '2ti': '2 Timothy', 'tit': 'Titus',
      'phm': 'Philemon', 'heb': 'Hebrews', 'jas': 'James', '1pe': '1 Peter', '2pe': '2 Peter',
      '1jo': '1 John', '2jo': '2 John', '3jo': '3 John', 'jud': 'Jude', 'rev': 'Revelation'
    };

    var state = { translation: 'KJV', book: 'John', chapter: 1 };
    var bookCache = {};

    function xhrGetJSON(url, cb) {
      var xhr;
      try { xhr = new XMLHttpRequest(); } catch (e) { cb(e); return; }
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200 || xhr.status === 0) {
          var parsed;
          try { parsed = JSON.parse(xhr.responseText); } catch (e) { cb(e); return; }
          cb(null, parsed);
        } else {
          cb(new Error('HTTP ' + xhr.status));
        }
      };
      try { xhr.send(); } catch (e) { cb(e); }
    }

    function loadBook(translation, book, cb) {
      var cacheKey = translation + '/' + book;
      if (bookCache[cacheKey] !== undefined) { cb(null, bookCache[cacheKey]); return; }
      var url = './translations/' + translation + '/' + encodeURIComponent(book) + '.json';
      xhrGetJSON(url, function (err, data) {
        bookCache[cacheKey] = err ? null : data;
        if (err) { cb(err); return; }
        cb(null, data);
      });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function maxChapter(book) { return CHAPTER_COUNTS[book] || 1; }

    function prevBook(book) {
      var idx = BOOKS.indexOf(book);
      return idx > 0 ? BOOKS[idx - 1] : null;
    }
    function nextBook(book) {
      var idx = BOOKS.indexOf(book);
      return (idx >= 0 && idx < BOOKS.length - 1) ? BOOKS[idx + 1] : null;
    }

    function normaliseBook(raw) {
      var s = raw.replace(/\s+/g, '').toLowerCase();
      if (BOOK_ALIASES[s]) return BOOK_ALIASES[s];
      for (var i = 0; i < BOOKS.length; i++) {
        var bl = BOOKS[i].toLowerCase().replace(/\s+/g, '');
        if (bl.indexOf(s) === 0) return BOOKS[i];
        if (BOOKS[i].toLowerCase().indexOf(raw.toLowerCase()) === 0) return BOOKS[i];
      }
      return null;
    }

    function showScreen(which) {
      document.getElementById('loading').style.display = which === 'loading' ? 'block' : 'none';
      document.getElementById('content').style.display = which === 'content' ? 'block' : 'none';
      document.getElementById('picker-screen').style.display = which === 'picker' ? 'block' : 'none';
      document.getElementById('search-screen').style.display = which === 'search' ? 'block' : 'none';
    }

    function showError(msg) {
      document.getElementById('content').innerHTML = '<p class="err">' + escHtml(msg) + '</p>';
      showScreen('content');
    }

    function setNav(loc, prevHref, nextHref) {
      document.getElementById('nav-loc').innerHTML = escHtml(loc);
      document.getElementById('nav-prev-wrap').innerHTML = prevHref
        ? '<a href="' + prevHref + '">\u00ab Prev</a>' : '';
      document.getElementById('nav-next-wrap').innerHTML = nextHref
        ? '<a href="' + nextHref + '">Next \u00bb</a>' : '';
    }

    function renderPassage(translation, book, chapter) {
      showScreen('loading');
      loadBook(translation, book, function (err, bookData) {
        if (err || !bookData) {
          showError('Could not load ' + book + ' (' + translation + '). This translation may not be downloaded yet \u2014 try KJV or BSB.');
          return;
        }
        var bd = (bookData[book] !== undefined) ? bookData[book] : bookData;
        var chapterData = bd[String(chapter)];
        if (!chapterData) { showError('Chapter ' + chapter + ' not found in ' + book + '.'); return; }

        var html = '<h2 class="chapter-title">'
          + escHtml(book) + ' ' + chapter
          + ' <span>(' + escHtml(translation) + ')</span>'
          + '</h2>';

        if (chapterData['0']) {
          html += '<p class="passage-prologue">' + escHtml(chapterData['0']) + '</p>';
        }

        var verseNums = [];
        var k;
        for (k in chapterData) {
          if (chapterData.hasOwnProperty(k)) {
            var n = parseInt(k, 10);
            if (n > 0) verseNums.push(n);
          }
        }
        verseNums.sort(function (a, b) { return a - b; });

        html += '<p class="passage-para">';
        for (var i = 0; i < verseNums.length; i++) {
          var v = verseNums[i];
          html += '<span id="v' + v + '">'
            + '<sup class="verse-num">' + v + '</sup> '
            + escHtml(chapterData[String(v)] || '') + ' '
            + '</span>';
        }
        html += '</p>';

        var prevChap = chapter > 1 ? chapter - 1 : null;
        var nextChap = chapter < maxChapter(book) ? chapter + 1 : null;
        var prevBk = prevBook(book);
        var nextBk = nextBook(book);
        var base = '#r/' + encodeURIComponent(translation) + '/';

        var prevHref = prevChap
          ? base + encodeURIComponent(book) + '/' + prevChap
          : (prevBk ? base + encodeURIComponent(prevBk) + '/' + maxChapter(prevBk) : null);
        var nextHref = nextChap
          ? base + encodeURIComponent(book) + '/' + nextChap
          : (nextBk ? base + encodeURIComponent(nextBk) + '/1' : null);

        setNav(book + ' ' + chapter, prevHref, nextHref);
        document.getElementById('content').innerHTML = html;
        showScreen('content');
        try { window.scrollTo(0, 0); } catch (e) { }
      });
    }

    function renderPicker() {
      showScreen('picker');
      var html = '<h3>Books</h3><ul id="book-list">';
      for (var i = 0; i < BOOKS.length; i++) {
        var b = BOOKS[i];
        html += '<li><a href="#picker/' + encodeURIComponent(b) + '">' + escHtml(b) + '</a></li>';
      }
      html += '</ul>';
      document.getElementById('picker-screen').innerHTML = html;
      setNav('Browse', null, null);
    }

    function renderPickerBook(book) {
      state.book = book;
      showScreen('picker');
      var chapCount = maxChapter(book);
      var base = '#r/' + encodeURIComponent(state.translation) + '/' + encodeURIComponent(book) + '/';
      var html = '<a class="picker-back" href="#picker">\u00ab All books</a>'
        + '<h3>' + escHtml(book) + '</h3>'
        + '<div id="chap-list">';
      for (var c = 1; c <= chapCount; c++) {
        html += '<a href="' + base + c + '">' + c + '</a>';
      }
      html += '</div>';
      document.getElementById('picker-screen').innerHTML = html;
      setNav(escHtml(book), null, null);
    }

    function renderSearch() {
      showScreen('search');
      setNav('Search', null, null);
    }

    function runSearch(query) {
      var q = String(query || '').replace(/^\s+|\s+$/g, '');
      if (!q) return;
      var resultsEl = document.getElementById('search-results');
      resultsEl.innerHTML = '<p style="font-family:Arial;font-size:18px;">Searching&hellip;</p>';

      var refMatch = q.match(/^((?:[1-3]\s+)?[A-Za-z][A-Za-z ]*?)\s+(\d+)(?::(\d+))?$/i);
      if (refMatch) {
        var rBook = normaliseBook(refMatch[1].trim());
        if (rBook) {
          window.location.hash = '#r/' + encodeURIComponent(state.translation)
            + '/' + encodeURIComponent(rBook) + '/' + parseInt(refMatch[2], 10);
          return;
        }
      }

      var indexUrl = './translations/' + state.translation + '/' + state.translation + '_search_index.json';
      xhrGetJSON(indexUrl, function (err, index) {
        if (err || !index) {
          resultsEl.innerHTML = '<p class="err">Search index not available for '
            + escHtml(state.translation) + '. Try KJV or BSB.</p>';
          return;
        }
        var words = q.toLowerCase().split(/[^a-z']+/);
        var filtered = [];
        for (var i = words.length - 1; i >= 0; i--) {
          if (words[i].length === 0) words.splice(i, 1);
        }

        var ref;
        for (ref in index) {
          if (!index.hasOwnProperty(ref)) continue;
          var text = String(index[ref]).toLowerCase();
          var match = true;
          for (var wi = 0; wi < words.length; wi++) {
            if (text.indexOf(words[wi]) === -1) { match = false; break; }
          }
          if (match) filtered.push({ ref: ref, text: String(index[ref]) });
          if (filtered.length >= 200) break;
        }

        if (filtered.length === 0) {
          resultsEl.innerHTML = '<p style="font-family:Arial;font-size:18px;">No results for &ldquo;'
            + escHtml(q) + '&rdquo;.</p>';
          return;
        }

        var html = '<p style="font-family:Arial;font-size:18px;">'
          + filtered.length + ' result' + (filtered.length === 1 ? '' : 's')
          + ' for &ldquo;' + escHtml(q) + '&rdquo;</p>';

        for (var ri = 0; ri < filtered.length; ri++) {
          var r = filtered[ri];
          var colonIdx = r.ref.lastIndexOf(':');
          var spaceIdx = r.ref.lastIndexOf(' ', colonIdx);
          var rBk = r.ref.slice(0, spaceIdx);
          var rCh = r.ref.slice(spaceIdx + 1, colonIdx);
          var linkHref = '#r/' + encodeURIComponent(state.translation)
            + '/' + encodeURIComponent(rBk) + '/' + rCh;
          html += '<div class="result-item">'
            + '<div class="result-ref"><a href="' + linkHref + '">' + escHtml(r.ref) + '</a></div>'
            + '<div class="result-text">' + escHtml(r.text) + '</div>'
            + '</div>';
        }
        resultsEl.innerHTML = html;
      });
    }

    function parseHash() {
      var hash = window.location.hash || '';
      if (hash.charAt(0) === '#') hash = hash.slice(1);
      var qPos = hash.indexOf('?');
      var qs = '';
      if (qPos !== -1) { qs = hash.slice(qPos + 1); hash = hash.slice(0, qPos); }
      return { parts: hash.split('/'), qs: qs };
    }

    // function parseQS(qs) {
    //   var out = {};
    //   var pairs = qs.split('&');
    //   for (var i = 0; i < pairs.length; i++) {
    //     var eq = pairs[i].indexOf('=');
    //     if (eq === -1) continue;
    //     out[decodeURIComponent(pairs[i].slice(0, eq))] = decodeURIComponent(pairs[i].slice(eq + 1));
    //   }
    //   return out;
    // }

    function parseQS(qs) {
      var out = Object.create(null);
      var pairs = qs.split('&');

      for (var i = 0; i < pairs.length; i++) {
        var eq = pairs[i].indexOf('=');
        if (eq === -1) continue;

        var key = decodeURIComponent(pairs[i].slice(0, eq));
        if (key !== 'q') continue;

        out.q = decodeURIComponent(pairs[i].slice(eq + 1));
      }

      return out;
    }

    function route() {
      var parsed = parseHash();
      var parts = parsed.parts;
      var qs = parseQS(parsed.qs);
      var transEl = document.getElementById('trans-select');

      if (parts[0] === 'r' && parts.length >= 4) {
        state.translation = decodeURIComponent(parts[1]) || 'KJV';
        state.book = decodeURIComponent(parts[2]) || 'John';
        state.chapter = parseInt(parts[3], 10) || 1;
        transEl.value = state.translation;
        renderPassage(state.translation, state.book, state.chapter);
        return;
      }
      if (parts[0] === 'picker') {
        if (parts[1]) renderPickerBook(decodeURIComponent(parts[1]));
        else renderPicker();
        return;
      }
      if (parts[0] === 'search') {
        renderSearch();
        if (qs['q']) {
          document.getElementById('search-input').value = qs['q'];
          runSearch(qs['q']);
        }
        return;
      }
      renderPassage(state.translation, state.book, state.chapter);
    }

    document.getElementById('jump-form').onsubmit = function () {
      var trans = document.getElementById('trans-select').value;
      var refRaw = document.getElementById('ref-input').value.replace(/^\s+|\s+$/g, '');
      if (!refRaw) return false;
      state.translation = trans;
      var m = refRaw.match(/^((?:[1-3]\s+)?[A-Za-z][A-Za-z ]*?)\s+(\d+)(?::(\d+))?$/i);
      if (m) {
        var book = normaliseBook(m[1].trim()) || m[1].trim();
        window.location.hash = '#r/' + encodeURIComponent(trans)
          + '/' + encodeURIComponent(book) + '/' + parseInt(m[2], 10);
      } else {
        window.location.hash = '#search?q=' + encodeURIComponent(refRaw);
      }
      return false;
    };

    document.getElementById('picker-link').onclick = function () {
      window.location.hash = '#picker'; return false;
    };
    document.getElementById('search-link').onclick = function () {
      window.location.hash = '#search'; return false;
    };
    document.getElementById('search-form').onsubmit = function () {
      var q = document.getElementById('search-input').value;
      window.location.hash = '#search?q=' + encodeURIComponent(q);
      runSearch(q);
      return false;
    };

    if (window.addEventListener) {
      window.addEventListener('hashchange', route, false);
    } else if (window.attachEvent) {
      window.attachEvent('onhashchange', route);
    }

    route();
  </script>
