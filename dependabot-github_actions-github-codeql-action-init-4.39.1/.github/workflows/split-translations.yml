name: Split translations into per-book files

on:
  workflow_dispatch:
    inputs:
      translation:
        description: >
          Single translation to split (ASV, BLB, BSB, KJV, LEB, MSB, NET, WEB).
          Leave blank to split all 8.
        required: false
        default: ''
      branch:
        description: Branch to commit results to (defaults to the branch this workflow runs on)
        required: false
        default: ''

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run split script
        run: |
          if [ -n "${{ github.event.inputs.translation }}" ]; then
            python scripts/split_translations.py ${{ github.event.inputs.translation }}
          else
            python scripts/split_translations.py
          fi

      - name: Commit per-book files
        run: |
          git config user.name  "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add translations/
          if git diff --cached --quiet; then
            echo "No changes to commit — per-book files already up to date."
          else
            TRANS="${{ github.event.inputs.translation }}"
            MSG="build: split $( [ -n "$TRANS" ] && echo "$TRANS" || echo "all translations" ) into per-book JSON files"
            git commit -m "$MSG"
            TARGET="${{ github.event.inputs.branch }}"
            REF="$( [ -n "$TARGET" ] && echo "$TARGET" || echo "${GITHUB_REF#refs/heads/}" )"
            git push origin HEAD:"$REF"
          fi
